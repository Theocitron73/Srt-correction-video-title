name: Deploy to VPS

on:
  push:
    branches: [ main, master ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@master
        with:
          host: 51.210.104.232
          username: root
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            cd /var/www/srt-app
            git pull
            npm install --legacy-peer-deps
            npm run build
            pm2 restart srt-app
